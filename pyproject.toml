[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "geoknit"
dynamic = ["version"]
description = "Local, open-source visual programming for geospatial analysis."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "tanxiaoo" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pyyaml>=6.0",        # component file headers
    "numpy>=1.26",        # raster arrays
    "pandas>=2.1",        # Table type
    "xarray>=2024.1",     # Raster type
    "rioxarray>=0.15",    # Raster I/O and metadata (.rio)
    "rasterio>=1.3.9",    # GeoTIFF read/write (wheels, no osgeo)
    "geopandas>=0.14",    # Vector type
    "pyogrio>=0.7",       # vector I/O for geopandas
    "shapely>=2.0",       # geometries
    "pyproj>=3.6",        # CRS handling
    "dask[array]>=2024.1",  # lazy, chunked rasters (SPEC 3)
    "pyarrow>=14",        # Parquet / GeoParquet disk cache (SPEC 6)
    "joblib>=1.3",        # Model disk cache (SPEC 6)
    "scikit-learn>=1.3",  # Random Forest, SVM, train/test split, metrics (SPEC 7)
    "fastapi>=0.110",     # REST API and OpenAPI /docs (SPEC 9)
    "uvicorn>=0.29",      # local ASGI server for `geoknit [folder]`
    "websockets>=11",     # WebSocket support in uvicorn (/ws)
    "rio-tiler>=9",       # Map Viewer raster tiles from COGs and overviews (SPEC 8, 9)
    "typing_extensions>=4.13",  # rio-tiler 9 needs TypedDict(extra_items) but asks for 4.10
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",  # test runner
    "ruff>=0.6",    # lint + format
    "httpx>=0.27",  # FastAPI TestClient
]

[project.scripts]
geoknit = "geoknit.cli:main"

[project.urls]
Homepage = "https://github.com/tanxiaoo/geoknit"

[tool.hatch.version]
path = "geoknit/__init__.py"

# The built frontend (git-ignored) goes into both: a wheel built from the
# sdist must still have the canvas. hatch_build.py refuses a wheel without it.
[tool.hatch.build.targets.sdist]
only-include = [
    "/geoknit",
    "/tests",
    "/examples",
    "/frontend",
    "/docs",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/frontend/node_modules",
    "/frontend/test-results",
    "/frontend/playwright-report",
    "/examples/**/data",
    "/examples/**/outputs",
    "/docs/ui",  # design mockups, 5 MB
    "__pycache__",
]
artifacts = ["geoknit/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["geoknit"]
artifacts = ["geoknit/server/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "*.md"]  # docs keep hand-aligned code examples

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]  # settings values and port data are genuinely dynamic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]
# Component files are scripts: inputs are injected as variables, imports follow
# the header and settings blocks, and helper functions stay unannotated.
"geoknit/components/builtin/**" = ["F821", "E402", "ANN", "B028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
