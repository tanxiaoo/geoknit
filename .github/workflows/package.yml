name: Package

# Build the sdist and wheel (with the frontend inside), then install the wheel
# into a fresh environment on each platform and run scripts/smoke_test.py.
# Called by ci.yml on every push / PR and by release.yml before publishing.

on:
  workflow_call:
    inputs:
      expected-version:
        description: "version geoknit --version must report (empty: not checked)"
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      # Builds the sdist, then the wheel from the sdist (the frontend must survive that).
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel contains the canvas
        run: |
          python - <<'EOF'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          assert "geoknit/server/static/index.html" in names, "no frontend in the wheel"
          assert any(n.startswith("geoknit/server/static/assets/") for n in names)
          print(wheel.name, len(names), "files")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4  # for scripts/ and examples/synthetic only
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          echo "VENV_PY=$bin/python" >> "$GITHUB_ENV"
          "$bin/python" -m pip install --upgrade pip
          "$bin/python" -m pip install dist/*.whl
      - name: Smoke test
        run: |
          if [ -n "${{ inputs.expected-version }}" ]; then
            "$VENV_PY" scripts/smoke_test.py --version "${{ inputs.expected-version }}"
          else
            "$VENV_PY" scripts/smoke_test.py
          fi
